name: updatehub-preview

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-updatehub}
      POSTGRES_USER: ${POSTGRES_USER:-updatehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
      args:
        PIP_INDEX_URL: ${PREVIEW_PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    restart: unless-stopped
    environment:
      ENVIRONMENT: preview
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-updatehub}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-updatehub}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?Set PUBLIC_SITE_URL}
      CORS_ORIGINS: ${PREVIEW_EXTRA_ORIGINS:-http://127.0.0.1:13010,http://localhost:13010}
      STATION_SIGNING_KEY: ${STATION_SIGNING_KEY:?Set STATION_SIGNING_KEY}
      LEGACY_ENABLED: "false"
      SITE_NAME: ${SITE_NAME:-版本喵}
      SITE_DESCRIPTION: ${SITE_DESCRIPTION:-软件更新、安装说明和群公告，都在这里}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: infra/web/Dockerfile
      args:
        NPM_CONFIG_REGISTRY: ${PREVIEW_NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?Set PUBLIC_SITE_URL}
    read_only: true
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 8
    ports:
      - "${PREVIEW_BIND:-0.0.0.0}:${PREVIEW_PORT:-13010}:3000"
    networks: [backend, edge]

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres_data:
  uploads:
