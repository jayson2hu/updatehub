name: updatehub

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-updatehub}
      POSTGRES_USER: ${POSTGRES_USER:-updatehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-updatehub}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-updatehub}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      SITE_NAME: ${SITE_NAME:-UpdateHub}
      SITE_DESCRIPTION: ${SITE_DESCRIPTION:-查看软件更新、使用提醒与维护通知，了解影响和下一步行动。}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      UPLOAD_DIR: /data/uploads
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: infra/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:
