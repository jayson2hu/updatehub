name: updatehub-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-updatehub}
      POSTGRES_USER: ${POSTGRES_USER:-updatehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-updatehub}:${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-updatehub}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?Set an HTTPS PUBLIC_SITE_URL}
      CORS_ORIGINS: ""
      STATION_SIGNING_KEY: ${STATION_SIGNING_KEY:?Set a persistent random STATION_SIGNING_KEY of at least 32 characters}
      MINIAPP_REFERER_PREFIXES: ${MINIAPP_REFERER_PREFIXES:-}
      LEGACY_ENABLED: "false"
      SITE_NAME: ${SITE_NAME:-UpdateHub}
      SITE_DESCRIPTION: ${SITE_DESCRIPTION:-查看软件更新、使用提醒与维护通知，了解影响和下一步行动。}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: infra/web/Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?Set an HTTPS PUBLIC_SITE_URL}
    read_only: true
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks: [backend, edge]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set the public domain}
      ACME_EMAIL: ${ACME_EMAIL:?Set the certificate contact email}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [edge]

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:
