name: Validate application and recovery

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          API_INTERNAL_URL: http://127.0.0.1:8000
          PUBLIC_SITE_URL: http://localhost:3000

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: updatehub_ci
          POSTGRES_PASSWORD: ci-disposable-database-only
          POSTGRES_DB: updatehub_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U updatehub_ci -d updatehub_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+psycopg://updatehub_ci:ci-disposable-database-only@127.0.0.1:5432/updatehub_ci
      ENVIRONMENT: test
      PUBLIC_SITE_URL: http://localhost:3000
      UPLOAD_DIR: /tmp/updatehub-ci-uploads
      ADMIN_INITIAL_EMAIL: admin@example.test
      ADMIN_INITIAL_PASSWORD: CI-only-password-9x!temporary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Apply PostgreSQL migrations
        run: alembic upgrade head
      - name: Check migration and seed idempotence
        run: |
          alembic check
          python -m app.cli seed
          python -m app.cli seed
          python -m app.cli seed-content
          python -m app.cli seed-content
          python -m app.cli create-admin
      - name: PostgreSQL migration, catalog, content and analytics regression
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url
          engine = create_engine(make_url(os.environ['DATABASE_URL']).set(database='postgres'), isolation_level='AUTOCOMMIT')
          with engine.connect() as connection:
              connection.execute(text('CREATE DATABASE updatehub_test_core'))
              connection.execute(text('CREATE DATABASE updatehub_test_content'))
          engine.dispose()
          PY
          DATABASE_URL="${DATABASE_URL%/*}/updatehub_test_core" python ../../tests/postgres_smoke.py
          DATABASE_URL="${DATABASE_URL%/*}/updatehub_test_content" python tests/postgres_content_smoke.py
      - name: API tests
        run: python -m pytest -q
      - name: PostgreSQL application smoke
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/updatehub-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ready > /dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/ready
          curl --fail http://127.0.0.1:8000/api/v1/software
      - name: Logs on failure
        if: failure()
        run: cat /tmp/updatehub-api.log 2>/dev/null || true

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [web, api]
    env:
      DATABASE_URL: sqlite:////tmp/updatehub-browser-ci.db
      PUBLIC_SITE_URL: http://localhost:3000
      API_INTERNAL_URL: http://127.0.0.1:8000
      UPLOAD_DIR: /tmp/updatehub-browser-uploads
      ADMIN_INITIAL_EMAIL: browser@example.test
      ADMIN_INITIAL_PASSWORD: CI-only-browser-password-9x!
      E2E_ADMIN_EMAIL: browser@example.test
      E2E_ADMIN_PASSWORD: CI-only-browser-password-9x!
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: python -m pip install -r apps/api/requirements.txt -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run build
      - name: Browser task acceptance
        run: |
          (cd apps/api && python -m alembic upgrade head && python -m app.cli seed && python -m app.cli seed-content && python -m app.cli create-admin)
          (cd apps/api && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000) > /tmp/updatehub-api.log 2>&1 &
          api_pid=$!
          npm run start > /tmp/updatehub-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/api/v1/ready > /dev/null; then break; fi
            sleep 1
          done
          curl --fail http://localhost:3000/api/v1/ready
          python tests/admin_e2e.py
          python tests/product_workflow_e2e.py
          python tests/content_discovery_e2e.py
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance
          path: |
            artifacts/
            /tmp/updatehub-api.log
            /tmp/updatehub-web.log
          retention-days: 14

  container-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [web, api]
    env:
      POSTGRES_PASSWORD: ci-compose-validation-only
      PUBLIC_SITE_URL: https://example.com
      DOMAIN: example.com
      ACME_EMAIL: ops@example.com
      ADMIN_INITIAL_EMAIL: container@example.test
      ADMIN_INITIAL_PASSWORD: CI-only-container-password-9x!
      COMPOSE_PROJECT_NAME: updatehub-ci
    steps:
      - uses: actions/checkout@v4
      - name: Validate development and production Compose
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
      - name: Build production images without deploying
        run: docker compose -f docker-compose.prod.yml build api web
      - name: Production containers, volumes, backup and isolated restore
        run: |
          touch .env
          bash tests/container_restore.sh
      - name: Container logs
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --tail 150 api web postgres
      - name: Remove disposable CI services and volumes
        if: always()
        run: docker compose -f docker-compose.prod.yml down --volumes
